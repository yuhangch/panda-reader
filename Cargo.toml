[workspace]
members = [
    "apps/panda-reader",
    "crates/panda-core",
    "crates/panda-content",
    "crates/panda-plugins",
    "crates/panda-plugin-sdk",
    "crates/panda-store",
    "crates/panda-backup",
    "crates/panda-miniflux",
    "crates/panda-providers",
    "crates/panda-translate",
]
default-members = ["apps/panda-reader"]
resolver = "3"

[workspace.package]
edition = "2024"
version = "0.2.12"
publish = false
license = "MIT"

[workspace.dependencies]
age = "=0.11.1"
ammonia = "4.1"
anyhow = "1"
arboard = { version = "3", features = ["wayland-data-control"] }
chrono = { version = "0.4", features = ["serde"] }
directories = "6"
dom_smoothie = "0.18"
decruft = "0.2"
encoding_rs = "0.8"
rs-trafilatura = "0.2"
feed-rs = "2"
futures = "0.3"
flate2 = "1"
gpui-kit = "=0.7.3"
hex = "0.4"
ego-tree = "0.9.0"
html5ever = "0.29.1"
hmac = "0.12"
ipnet = "2"
image = "0.25"
reqwest_client = { package = "gpui-pre-reqwest-client", version = "=0.3.9" }
semver = "1"
opml = "1"
quick_html2md = "0.2"
markdown = "1.0"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "charset", "gzip", "brotli", "json", "rustls-tls", "socks", "system-proxy"] }
rusqlite = { version = "0.40.2", features = ["backup", "bundled", "fallible_uint", "functions"] }
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
scraper = "0.21"
sha2 = "0.10"
uuid = { version = "1", features = ["v4", "serde"] }
tempfile = "3"
toml = "0.8"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync", "time", "macros"] }
libc = "0.2"
url = "2"
zip = { version = "=8.6.0", default-features = false, features = ["deflate-flate2"] }
opendal = { version = "=0.59.5", default-features = false, features = ["services-webdav", "services-s3", "http-transport-reqwest", "executors-tokio"] }
