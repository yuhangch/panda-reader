[package]
name = "panda-reader"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[[bin]]
name = "panda-reader"
path = "src/main.rs"
# Keep GPUI's desktop bin out of the test harness: rustc overflows its stack
# expanding the UI-heavy test binary on Windows. The normal bin still builds.
test = false
bench = false

[dependencies]
ammonia.workspace = true
anyhow.workspace = true
arboard.workspace = true
base64 = "=0.22.1"
chrono.workspace = true
directories.workspace = true
gpui-kit.workspace = true
image.workspace = true
panda-content = { path = "../../crates/panda-content" }
panda-plugins = { path = "../../crates/panda-plugins" }
panda-core = { path = "../../crates/panda-core" }
panda-miniflux = { path = "../../crates/panda-miniflux" }
panda-providers = { path = "../../crates/panda-providers" }
panda-store = { path = "../../crates/panda-store" }
panda-translate = { path = "../../crates/panda-translate" }
reqwest.workspace = true
reqwest_client.workspace = true
scraper.workspace = true
resvg = "=0.45.1"
qrcodegen = "1.8"
quick_html2md.workspace = true
rfd.workspace = true
serde.workspace = true
serde_json.workspace = true
semver.workspace = true
sha2.workspace = true
tokio.workspace = true
url.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Registry", "Win32_System_Threading", "Win32_UI_Shell"] }

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[dev-dependencies]
tempfile.workspace = true

[target.'cfg(windows)'.build-dependencies]
embed-resource = "3.0.11"
